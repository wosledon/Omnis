<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omnis LLM 网关</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1e2329;
      --muted: #67727e;
      --line: #d9dee5;
      --accent: #0f766e;
      --accent-2: #7c3aed;
      --warn: #b45309;
      --bad: #b42318;
      --good: #047857;
      --shadow: 0 10px 28px rgba(28, 37, 49, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
      grid-column: 1 / -1;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 0;
    }

    .panel-body {
      padding: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
      outline: none;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
    }

    .btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 7px 12px;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .btn.secondary {
      border-color: #c4b5fd;
      color: var(--accent-2);
    }

    .btn.warn {
      border-color: #fed7aa;
      color: var(--warn);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef1f5;
    }

    .tab {
      min-height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 5px 10px;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 5px rgba(28, 37, 49, .09);
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .model-item {
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .model-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
    }

    .model-top,
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .name {
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      color: #fff;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .pill.good {
      background: var(--good);
    }

    .pill.warn {
      background: var(--warn);
    }

    .pill.bad {
      background: var(--bad);
    }

    .section {
      display: none;
    }

    .section.active {
      display: grid;
      gap: 12px;
    }

    .result {
      min-height: 140px;
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      background: #f8fafc;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .status {
      color: var(--muted);
      min-height: 20px;
    }

    .status.error {
      color: var(--bad);
    }

    .status.ok {
      color: var(--good);
    }

    @media (max-width: 980px) {
      .shell,
      .layout {
        display: block;
      }

      .layout > * + * {
        margin-top: 16px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        padding-bottom: 12px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Omnis LLM 网关</h1>
      <div class="toolbar">
        <button class="btn" id="refreshBtn" type="button">刷新</button>
        <button class="btn primary" id="saveBtn" type="button">保存配置</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head">
          <h2>模型配置</h2>
          <button class="btn secondary" id="newBtn" type="button">新建</button>
        </div>
        <div class="panel-body stack">
          <div class="grid">
            <div class="field">
              <label for="filterTenantId">租户</label>
              <input id="filterTenantId" value="default-tenant">
            </div>
            <div class="field">
              <label for="filterWorkspaceId">工作空间</label>
              <input id="filterWorkspaceId" value="default-workspace">
            </div>
            <div class="field full">
              <label for="filterApplicationId">应用</label>
              <input id="filterApplicationId" placeholder="可选">
            </div>
          </div>
          <div class="list" id="modelList"></div>
          <div class="status" id="listStatus"></div>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="config" type="button">配置</button>
            <button class="tab" data-tab="test" type="button">测试</button>
            <button class="tab" data-tab="logs" type="button">日志</button>
          </div>
          <button class="btn warn" id="disableBtn" type="button">停用</button>
        </div>

        <div class="panel-body">
          <section class="section active" id="configSection">
            <div class="grid">
              <div class="field">
                <label for="tenantId">租户</label>
                <input id="tenantId">
              </div>
              <div class="field">
                <label for="workspaceId">工作空间</label>
                <input id="workspaceId">
              </div>
              <div class="field">
                <label for="applicationId">应用</label>
                <input id="applicationId" placeholder="可选">
              </div>
              <div class="field">
                <label for="name">名称</label>
                <input id="name">
              </div>
              <div class="field">
                <label for="provider">Provider</label>
                <select id="provider">
                  <option value="0">OpenAI</option>
                  <option value="1">Azure OpenAI</option>
                  <option value="2">OpenAI Compatible</option>
                  <option value="3">豆包 Ark</option>
                  <option value="10">Ollama</option>
                  <option value="11">vLLM</option>
                  <option value="12">TGI</option>
                </select>
              </div>
              <div class="field">
                <label for="status">状态</label>
                <select id="status">
                  <option value="1">Active</option>
                  <option value="0">Draft</option>
                  <option value="2">Disabled</option>
                  <option value="3">Archived</option>
                </select>
              </div>
              <div class="field">
                <label for="model">模型</label>
                <input id="model" list="modelOptions" value="gpt-4o-mini">
                <datalist id="modelOptions">
                  <option value="gpt-4o-mini"></option>
                  <option value="Doubao-1.5-lite-32k"></option>
                  <option value="Doubao-1.5-pro-32k"></option>
                </datalist>
              </div>
              <div class="field">
                <label for="deploymentName">部署名</label>
                <input id="deploymentName" placeholder="Azure 可填">
              </div>
              <div class="field full">
                <label for="endpoint">Endpoint</label>
                <input id="endpoint" value="https://api.openai.com/v1">
              </div>
              <div class="field">
                <label for="apiKey">API Key</label>
                <input id="apiKey" type="password" autocomplete="new-password">
              </div>
              <div class="field">
                <label for="apiVersion">API Version</label>
                <input id="apiVersion" placeholder="Azure 默认 2024-10-21">
              </div>
              <div class="field">
                <label for="priority">优先级</label>
                <input id="priority" type="number" min="0" value="100">
              </div>
              <div class="field">
                <label for="fallbackModelConfigId">备用配置 ID</label>
                <input id="fallbackModelConfigId" placeholder="可选">
              </div>
              <div class="field">
                <label for="timeoutSeconds">超时秒数</label>
                <input id="timeoutSeconds" type="number" min="1" value="60">
              </div>
              <div class="field">
                <label for="failureThreshold">失败阈值</label>
                <input id="failureThreshold" type="number" min="1" value="3">
              </div>
              <div class="field">
                <label for="circuitBreakSeconds">熔断秒数</label>
                <input id="circuitBreakSeconds" type="number" min="1" value="60">
              </div>
              <div class="field">
                <label for="temperature">Temperature</label>
                <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2">
              </div>
            </div>
            <div class="status" id="formStatus"></div>
          </section>

          <section class="section" id="testSection">
            <div class="grid">
              <div class="field">
                <label for="maxTokens">Max Tokens</label>
                <input id="maxTokens" type="number" min="1" value="512">
              </div>
              <div class="field">
                <label for="testModelConfigId">配置 ID</label>
                <input id="testModelConfigId" readonly>
              </div>
              <div class="field full">
                <label for="systemPrompt">系统消息</label>
                <textarea id="systemPrompt">你是 Omnis 企业客服助手，回答要简洁、准确。</textarea>
              </div>
              <div class="field full">
                <label for="userPrompt">用户消息</label>
                <textarea id="userPrompt">用一句话介绍 Omnis LLM 网关的作用。</textarea>
              </div>
            </div>
            <div class="toolbar">
              <button class="btn primary" id="testBtn" type="button">发送</button>
            </div>
            <div class="result" id="testResult"></div>
          </section>

          <section class="section" id="logsSection">
            <div class="toolbar">
              <button class="btn" id="loadLogsBtn" type="button">加载日志</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>配置</th>
                    <th>模型</th>
                    <th>状态</th>
                    <th>Token</th>
                    <th>耗时</th>
                    <th>错误</th>
                  </tr>
                </thead>
                <tbody id="logsBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <script>
    const providerNames = {
      0: "OpenAI",
      1: "Azure OpenAI",
      2: "OpenAI Compatible",
      3: "豆包 Ark",
      10: "Ollama",
      11: "vLLM",
      12: "TGI"
    };
    const providerModelHints = {
      3: ["Doubao-1.5-lite-32k", "Doubao-1.5-pro-32k"]
    };
    const doubaoProviderModels = {
      "Doubao-1.5-lite-32k": "doubao-1-5-lite-32k-250115",
      "Doubao-1.5-pro-32k": "doubao-1-5-pro-32k-250115"
    };
    const statusNames = { 0: "Draft", 1: "Active", 2: "Disabled", 3: "Archived" };
    const state = { selectedId: null, models: [] };
    const $ = (id) => document.getElementById(id);

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => setTab(tab.dataset.tab));
    });
    $("refreshBtn").addEventListener("click", loadModels);
    $("newBtn").addEventListener("click", newModel);
    $("saveBtn").addEventListener("click", saveModel);
    $("disableBtn").addEventListener("click", disableModel);
    $("testBtn").addEventListener("click", testModel);
    $("loadLogsBtn").addEventListener("click", loadLogs);
    $("provider").addEventListener("change", applyProviderDefaults);

    newModel();
    loadModels();

    function setTab(name) {
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === name));
      document.querySelectorAll(".section").forEach((section) => section.classList.remove("active"));
      $(`${name}Section`).classList.add("active");
      if (name === "logs") loadLogs();
    }

    function newModel() {
      state.selectedId = null;
      const tenant = $("filterTenantId").value || "default-tenant";
      const workspace = $("filterWorkspaceId").value || "default-workspace";
      $("tenantId").value = tenant;
      $("workspaceId").value = workspace;
      $("applicationId").value = $("filterApplicationId").value || "";
      $("name").value = "OpenAI 默认模型";
      $("provider").value = "0";
      $("status").value = "1";
      $("model").value = "gpt-4o-mini";
      $("deploymentName").value = "";
      $("endpoint").value = "https://api.openai.com/v1";
      $("apiKey").value = "";
      $("apiVersion").value = "";
      $("priority").value = "100";
      $("fallbackModelConfigId").value = "";
      $("timeoutSeconds").value = "60";
      $("failureThreshold").value = "3";
      $("circuitBreakSeconds").value = "60";
      $("temperature").value = "0.2";
      $("testModelConfigId").value = "";
      $("formStatus").textContent = "";
      renderModelList();
    }

    async function loadModels() {
      setStatus("listStatus", "加载中...");
      const params = new URLSearchParams({
        tenantId: $("filterTenantId").value || "default-tenant"
      });
      addParam(params, "workspaceId", $("filterWorkspaceId").value);
      addParam(params, "applicationId", $("filterApplicationId").value);

      try {
        const data = await requestJson(`/api/llm/model-configs?${params}`);
        state.models = data;
        renderModelList();
        setStatus("listStatus", `${data.length} 条配置`, "ok");
      } catch (error) {
        setStatus("listStatus", error.message, "error");
      }
    }

    function renderModelList() {
      const list = $("modelList");
      list.innerHTML = "";
      if (state.models.length === 0) {
        list.innerHTML = `<div class="meta">暂无配置</div>`;
        return;
      }

      state.models.forEach((model) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = `model-item ${model.id === state.selectedId ? "active" : ""}`;
        item.innerHTML = `
          <div class="model-top">
            <span class="name">${escapeHtml(model.name)}</span>
            <span class="pill ${pillClass(model)}">${statusNames[model.status]}</span>
          </div>
          <div class="meta-row">
            <span class="meta">${providerNames[model.provider]} / ${escapeHtml(model.model)}</span>
            <span class="meta">P${model.priority}</span>
          </div>
          <div class="meta">${escapeHtml(model.endpoint)}</div>
        `;
        item.addEventListener("click", () => selectModel(model));
        list.appendChild(item);
      });
    }

    function selectModel(model) {
      state.selectedId = model.id;
      $("tenantId").value = model.tenantId;
      $("workspaceId").value = model.workspaceId;
      $("applicationId").value = model.applicationId || "";
      $("name").value = model.name;
      $("provider").value = String(model.provider);
      $("status").value = String(model.status);
      $("model").value = model.model;
      $("deploymentName").value = model.deploymentName || "";
      $("endpoint").value = model.endpoint;
      $("apiKey").value = "";
      $("apiVersion").value = model.parameters?.apiVersion || "";
      $("priority").value = String(model.priority);
      $("fallbackModelConfigId").value = model.fallbackModelConfigId || "";
      $("timeoutSeconds").value = String(model.timeoutSeconds);
      $("failureThreshold").value = String(model.failureThreshold);
      $("circuitBreakSeconds").value = String(model.circuitBreakSeconds);
      $("temperature").value = model.parameters?.temperature || $("temperature").value || "0.2";
      $("testModelConfigId").value = model.id;
      $("formStatus").textContent = model.credentialsConfigured ? "凭据已配置" : "凭据未配置";
      $("formStatus").className = `status ${model.credentialsConfigured ? "ok" : ""}`;
      renderModelList();
    }

    async function saveModel() {
      const body = collectModelPayload();
      if (!body) return;

      try {
        setStatus("formStatus", "保存中...");
        const saved = state.selectedId
          ? await requestJson(`/api/llm/model-configs/${state.selectedId}`, { method: "PUT", body })
          : await requestJson("/api/llm/model-configs", { method: "POST", body });
        state.selectedId = saved.id;
        $("testModelConfigId").value = saved.id;
        setStatus("formStatus", "已保存", "ok");
        await loadModels();
        const latest = state.models.find((item) => item.id === saved.id);
        if (latest) selectModel(latest);
      } catch (error) {
        setStatus("formStatus", error.message, "error");
      }
    }

    async function disableModel() {
      if (!state.selectedId) {
        setStatus("formStatus", "请选择配置", "error");
        return;
      }

      try {
        await requestJson(`/api/llm/model-configs/${state.selectedId}/disable`, { method: "POST" });
        setStatus("formStatus", "已停用", "ok");
        await loadModels();
      } catch (error) {
        setStatus("formStatus", error.message, "error");
      }
    }

    async function testModel() {
      const configId = state.selectedId;
      if (!configId) {
        $("testResult").textContent = "请先保存或选择模型配置。";
        return;
      }

      const body = {
        tenantId: $("tenantId").value.trim(),
        workspaceId: $("workspaceId").value.trim(),
        applicationId: optional($("applicationId").value),
        modelConfigId: configId,
        temperature: numberOrNull($("temperature").value),
        maxTokens: numberOrNull($("maxTokens").value),
        messages: [
          { role: 0, content: $("systemPrompt").value },
          { role: 1, content: $("userPrompt").value }
        ]
      };

      $("testResult").textContent = "请求中...";
      try {
        const result = await requestJson("/api/llm/chat/completions", { method: "POST", body });
        $("testResult").textContent = [
          result.content,
          "",
          `模型: ${result.modelConfigName} / ${result.model}`,
          `Token: ${result.totalTokens} (${result.promptTokens}+${result.completionTokens})`,
          `耗时: ${result.durationMs} ms`
        ].join("\n");
      } catch (error) {
        $("testResult").textContent = error.message;
      }
    }

    async function loadLogs() {
      const params = new URLSearchParams({ tenantId: $("filterTenantId").value || $("tenantId").value || "default-tenant" });
      addParam(params, "workspaceId", $("filterWorkspaceId").value || $("workspaceId").value);
      addParam(params, "applicationId", $("filterApplicationId").value || $("applicationId").value);
      addParam(params, "modelConfigId", state.selectedId);

      try {
        const logs = await requestJson(`/api/llm/invocation-logs?${params}`);
        $("logsBody").innerHTML = logs.map((log) => `
          <tr>
            <td>${formatDate(log.createdAt)}</td>
            <td>${escapeHtml(log.modelConfigName)}</td>
            <td>${providerNames[log.provider]}<br>${escapeHtml(log.model)}</td>
            <td>${log.status}${log.usedFallback ? "<br>Fallback" : ""}</td>
            <td>${log.totalTokens}</td>
            <td>${log.durationMs} ms</td>
            <td>${escapeHtml(log.errorMessage || "")}</td>
          </tr>
        `).join("");
      } catch (error) {
        $("logsBody").innerHTML = `<tr><td colspan="7">${escapeHtml(error.message)}</td></tr>`;
      }
    }

    function collectModelPayload() {
      const tenantId = $("tenantId").value.trim();
      const workspaceId = $("workspaceId").value.trim();
      const name = $("name").value.trim();
      const model = $("model").value.trim();
      const endpoint = $("endpoint").value.trim();
      if (!tenantId || !workspaceId || !name || !model || !endpoint) {
        setStatus("formStatus", "租户、工作空间、名称、模型和 Endpoint 必填", "error");
        return null;
      }

      const parameters = {};
      addObjectValue(parameters, "apiVersion", $("apiVersion").value);
      addObjectValue(parameters, "temperature", $("temperature").value);
      if (Number($("provider").value) === 3) {
        addObjectValue(parameters, "providerModel", doubaoProviderModels[model] || model);
      }

      const credentials = {};
      addObjectValue(credentials, "apiKey", $("apiKey").value);

      const payload = {
        tenantId,
        workspaceId,
        applicationId: optional($("applicationId").value),
        name,
        provider: Number($("provider").value),
        model,
        endpoint,
        deploymentName: optional($("deploymentName").value),
        status: Number($("status").value),
        priority: Number($("priority").value || 100),
        fallbackModelConfigId: optional($("fallbackModelConfigId").value),
        timeoutSeconds: Number($("timeoutSeconds").value || 60),
        failureThreshold: Number($("failureThreshold").value || 3),
        circuitBreakSeconds: Number($("circuitBreakSeconds").value || 60),
        parameters
      };

      if (!state.selectedId || Object.keys(credentials).length > 0) {
        payload.credentials = credentials;
      }

      return payload;
    }

    async function requestJson(url, options = {}) {
      const init = {
        method: options.method || "GET",
        headers: { "Content-Type": "application/json" }
      };
      if (options.body) {
        init.body = JSON.stringify(options.body);
      }

      const response = await fetch(url, init);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        throw new Error(data?.error || response.statusText);
      }

      return data;
    }

    function applyProviderDefaults() {
      const provider = Number($("provider").value);
      if (provider === 0) {
        $("endpoint").value = "https://api.openai.com/v1";
        $("model").value = $("model").value || "gpt-4o-mini";
      } else if (provider === 1) {
        $("endpoint").value = $("endpoint").value.startsWith("https://api.openai.com") ? "" : $("endpoint").value;
        $("apiVersion").value = $("apiVersion").value || "2024-10-21";
      } else if (provider === 3) {
        $("endpoint").value = "https://ark.cn-beijing.volces.com/api/v3";
        $("model").value = "Doubao-1.5-lite-32k";
        $("name").value = $("name").value || "豆包默认模型";
      } else if (provider === 2 || provider === 10 || provider === 11) {
        $("endpoint").value = $("endpoint").value.startsWith("https://api.openai.com") ? "http://localhost:11434/v1" : $("endpoint").value;
      }
      syncModelHints(provider);
    }

    function syncModelHints(provider) {
      const modelInput = $("model");
      const datalist = $("modelOptions");
      const hints = providerModelHints[provider] || ["gpt-4o-mini"];
      datalist.innerHTML = hints.map((value) => `<option value="${escapeHtml(value)}"></option>`).join("");
      if (hints.length > 0 && !hints.includes(modelInput.value)) {
        modelInput.value = hints[0];
      }
    }

    function pillClass(model) {
      if (model.status === 1 && model.circuit?.state === 0) return "good";
      if (model.circuit?.state === 1) return "bad";
      return "warn";
    }

    function addParam(params, key, value) {
      if (value) params.set(key, value);
    }

    function addObjectValue(target, key, value) {
      const normalized = optional(value);
      if (normalized !== null) target[key] = normalized;
    }

    function optional(value) {
      const normalized = String(value || "").trim();
      return normalized.length === 0 ? null : normalized;
    }

    function numberOrNull(value) {
      const normalized = optional(value);
      return normalized === null ? null : Number(normalized);
    }

    function setStatus(id, message, kind = "") {
      const target = $(id);
      target.textContent = message;
      target.className = `status ${kind}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatDate(value) {
      return value ? new Date(value).toLocaleString() : "";
    }
  </script>
</body>
</html>
